services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rtc_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://host.docker.internal:3001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - rtc_network

  postgres:
    image: postgres:15
    container_name: rtc_postgres
    environment:
      POSTGRES_USER: rtc
      POSTGRES_PASSWORD: rtc_password
      POSTGRES_DB: rtc_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/seed.sql:/docker-entrypoint-initdb.d/seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rtc -d rtc_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rtc_network

  mongo:
    image: mongo:6.0
    container_name: rtc_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongo_data:/data/db
    networks:
      - rtc_network

networks:
  rtc_network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
