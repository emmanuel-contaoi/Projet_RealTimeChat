services:
  # Serveur backend Rust (API + WebSocket)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rtc_backend
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgres://rtc:rtc_password@postgres:5432/rtc_db
      - MONGO_URI=mongodb://root:password@mongo:27017
      - JWT_SECRET=super_secret_key
      - PORT=3001
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
    networks:
      - rtc_network

  # Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rtc_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    networks:
      - rtc_network

  # Base de donnees PostgreSQL (users, servers, channels)
  postgres:
    image: postgres:15
    container_name: rtc_postgres
    environment:
      POSTGRES_USER: rtc
      POSTGRES_PASSWORD: rtc_password
      POSTGRES_DB: rtc_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/seed.sql:/docker-entrypoint-initdb.d/seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rtc -d rtc_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rtc_network

  # Base de donnees MongoDB (messages)
  mongo:
    image: mongo:6.0
    container_name: rtc_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongo_data:/data/db
    networks:
      - rtc_network

networks:
  rtc_network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
