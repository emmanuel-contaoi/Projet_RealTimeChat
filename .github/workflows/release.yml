name: Release

# Tourne uniquement quand un tag "vX.X.X" est créé (ex: v1.0.0)
on:
  push:
    tags:
      - "v*"

jobs:
  # Crée la release GitHub avec le changelog
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code (avec tout l'historique pour le changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Générer le changelog depuis git log
        id: changelog
        run: |
          # Récupère le tag précédent
          PREVIOUS_TAG=$(git tag --sort=-version:refname | sed -n '2p')
          if [ -z "$PREVIOUS_TAG" ]; then
            # Première release : on prend tous les commits
            CHANGELOG=$(git log --pretty=format:"- %s" HEAD)
          else
            # Commits depuis le tag précédent
            CHANGELOG=$(git log --pretty=format:"- %s" ${PREVIOUS_TAG}..HEAD)
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Créer la GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Nouveautés

            ${{ steps.changelog.outputs.CHANGELOG }}
          draft: false
          prerelease: false

  # Compile le backend en mode release et l'uploade sur la release (après create-release)
  build-binaries:
    name: Build Binaries
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Mettre en cache les dépendances Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('backend/Cargo.lock') }}

      - name: Compiler le backend en mode release
        working-directory: ./backend
        run: cargo build --release

      - name: Uploader le binaire sur la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: backend/target/release/backend
