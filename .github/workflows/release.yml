name: Release

on:
  push:
    branches:
      - main
    # On garde aussi la possibilité de déclencher manuellement via un tag poussé par un humain
    tags:
      - "v*"

# Obligatoire pour que le bot puisse créer des releases et des tags
permissions:
  contents: write

jobs:
  # Calcule la version, crée le tag, génère le changelog et prépare la release
  prepare-release:
    name: Prepare Release
    runs-on: self-hosted
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      changelog: ${{ steps.tag_version.outputs.changelog }}
      release_type: ${{ steps.tag_version.outputs.release_type }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Utilise une action certifiée pour lire les Conventional Commits et créer le tag
      - name: Calculer le Tag et le Changelog
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false # Ne fait rien s'il n'y a pas de feat/fix/BREAKING CHANGE
          release_branches: main

      # Crée la Draft Release immédiatement si un bump a eu lieu
      - name: Créer la GitHub Release
        id: create_release
        if: steps.tag_version.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          draft: false
          prerelease: false

  # Compile et package l'application Tauri desktop
  build-tauri:
    name: Build Tauri Desktop App
    runs-on: self-hosted
    needs: prepare-release
    # Ne tourne que si un nouveau tag a été généré (ou poussé manuellement)
    if: needs.prepare-release.outputs.new_tag != '' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer les dépendances système (GTK/WebKit pour Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Mettre en cache les dépendances Cargo (Tauri)
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/src-tauri/target
          key: ${{ runner.os }}-cargo-tauri-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}

      - name: Installer les dépendances npm
        working-directory: ./frontend
        run: npm ci

      - name: Compiler l'application Tauri
        working-directory: ./frontend
        # 🔴 CORRECTION : Ajout de appimage pour que l'upload en dessous fonctionne
        run: npx tauri build --bundles deb,rpm,appimage
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Uploader les artefacts sur la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.new_tag || github.ref_name }}
          files: |
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage

  # Compile le backend en mode release et l'uploade sur la release
  build-binaries:
    name: Build Binaries
    runs-on: self-hosted
    needs: prepare-release
    if: needs.prepare-release.outputs.new_tag != '' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer les dépendances système (C, OpenSSL)
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Mettre en cache les dépendances Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('backend/Cargo.lock') }}

      - name: Compiler le backend en mode release
        working-directory: ./backend
        run: cargo build --release

      - name: Uploader le binaire sur la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.new_tag || github.ref_name }}
          files: backend/target/release/backend