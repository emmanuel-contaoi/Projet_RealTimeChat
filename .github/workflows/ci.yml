name: CI

# Tourne sur chaque push
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]

jobs:
  # Vérifie la qualité du code
  quality-checks:
    name: Quality Checks
    runs-on: self-hosted
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      # Installation des dépendances Rust
      - name: Installer les dépendances système (C, OpenSSL)
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev

      # Backend Rust
      - name: Installer Rust (avec rustfmt et clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Vérifier le formatage Rust
        working-directory: ./backend
        run: cargo fmt --check

      - name: Linter Rust
        working-directory: ./backend
        run: cargo clippy -- -D warnings

      # Frontend Next.js
      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Installer les dépendances frontend
        working-directory: ./frontend
        run: npm ci

      - name: Linter frontend (ESLint)
        working-directory: ./frontend
        run: npm run lint

      - name: Vérification des types TypeScript
        working-directory: ./frontend
        run: npx tsc --noEmit

  # Compile et teste le backend et le frontend (après quality-checks)
  build-and-test:
    name: Build and Test
    runs-on: self-hosted
    needs: quality-checks
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer les dépendances système (C, OpenSSL)
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev

      # Backend Rust avec cache
      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Mettre en cache les dépendances Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}

      - name: Installer cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin

      - name: Compiler le backend
        working-directory: ./backend
        run: cargo build
        env:
          SQLX_OFFLINE: true

      - name: Lancer les tests backend avec couverture
        working-directory: ./backend
        run: cargo tarpaulin --out Xml --output-dir coverage
        env:
          SQLX_OFFLINE: true
          JWT_SECRET: test_secret

      # Frontend avec cache
      - name: Installer Node.js (avec cache npm)
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances frontend
        working-directory: ./frontend
        run: npm ci

      - name: Compiler le frontend
        working-directory: ./frontend
        run: npm run build

      - name: Lancer les tests frontend avec couverture
        working-directory: ./frontend
        run: npx jest --runInBand --coverage --passWithNoTests

  # Vérifie les failles de sécurité dans les dépendances
  security-audit:
    name: Security Audit
    runs-on: self-hosted
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      # Backend
      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Installer cargo-audit (version rapide)
        uses: taiki-e/install-action@cargo-audit

      - name: Audit de sécurité Rust
        working-directory: ./backend
        run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0098 --ignore RUSTSEC-2026-0099

      # Frontend
      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances frontend
        working-directory: ./frontend
        run: npm ci

      - name: Audit de sécurité npm
        working-directory: ./frontend
        run: npm audit --audit-level=high --omit=dev