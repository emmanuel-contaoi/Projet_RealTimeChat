name: CI

# Tourne sur chaque push (toutes branches) et sur les PRs vers main
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # Vérifie la qualité du code (format, lint, types)
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      # Backend Rust
      - name: Installer Rust (avec rustfmt et clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Vérifier le formatage Rust
        working-directory: ./backend
        run: cargo fmt --check

      - name: Linter Rust
        working-directory: ./backend
        run: cargo clippy -- -D warnings

      # Frontend Next.js
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances frontend
        working-directory: ./frontend
        run: npm ci

      - name: Linter frontend (ESLint)
        working-directory: ./frontend
        run: npm run lint

      - name: Vérification des types TypeScript
        working-directory: ./frontend
        run: npx tsc --noEmit

  # Compile et teste le backend et le frontend (après quality-checks)
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: quality-checks
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      # Backend Rust avec cache
      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Mettre en cache les dépendances Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}

      - name: Compiler le backend
        working-directory: ./backend
        run: cargo build

      - name: Lancer les tests backend
        working-directory: ./backend
        run: cargo test

      # Frontend avec cache
      - name: Installer Node.js (avec cache npm)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances frontend
        working-directory: ./frontend
        run: npm ci

      - name: Compiler le frontend
        working-directory: ./frontend
        run: npm run build

      - name: Lancer les tests frontend
        working-directory: ./frontend
        run: npx jest --passWithNoTests

  # Vérifie les failles de sécurité dans les dépendances (tourne en parallèle)
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      # Backend
      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Installer cargo-audit
        run: cargo install cargo-audit

      - name: Audit de sécurité Rust
        working-directory: ./backend
        run: cargo audit

      # Frontend
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances frontend
        working-directory: ./frontend
        run: npm ci

      - name: Audit de sécurité npm
        working-directory: ./frontend
        run: npm audit --audit-level=high --omit=dev
