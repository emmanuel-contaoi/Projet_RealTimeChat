<svg xmlns="http://www.w3.org/2000/svg" width="920" height="260" viewBox="0 0 920 260">
  <defs>
    <linearGradient id="neonA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5C6CFF"/>
      <stop offset="1" stop-color="#8A5CFF"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- ICON -->
  <g transform="translate(30,28)" filter="url(#shadow)">
    <rect x="0" y="0" width="208" height="208" rx="58" fill="#111522" stroke="url(#neonA)" stroke-width="4"/>
    <rect x="14" y="14" width="180" height="180" rx="48" fill="#161B2E"/>

    <!-- Chat bubble -->
    <path d="M55 70
             Q55 54 71 54
             H137
             Q153 54 153 70
             V122
             Q153 138 137 138
             H103
             L86 154
             L88 138
             H71
             Q55 138 55 122
             Z"
          fill="none" stroke="#8FA2FF" stroke-width="5" stroke-linejoin="round"/>

    <!-- Minimal gaming face -->
    <path d="M78 92 Q104 76 130 92 Q126 114 104 114 Q82 114 78 92Z"
          fill="#0F1324" stroke="#6C7CFF" stroke-width="3"/>

    <circle cx="92" cy="100" r="4" fill="#8FA2FF"/>
    <circle cx="116" cy="100" r="4" fill="#8FA2FF"/>
  </g>

  <!-- WORDMARK -->
  <g transform="translate(270,78)">
    <text x="0" y="92"
          font-family="Orbitron, Rajdhani, 'Segoe UI', Arial, sans-serif"
          font-size="92"
          font-weight="800"
          letter-spacing="6"
          fill="#F1F3FF">
      NEXUS
    </text>
  </g>
</svg>
