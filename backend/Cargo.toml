[package]
name = "rtc-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Framework web (AXUM - choisi pour le projet)
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }

# Base de données (Postgres + Mongo)
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "macros"] }
mongodb = "2.8.0"

# Utilitaires (JSON, ID, Dates, Env)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"

# Auth & sécurité
jsonwebtoken = "9"
bcrypt = "0.15"
